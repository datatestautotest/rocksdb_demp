[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocksdb-dedup"
version = "0.1.3"
description = "基于 RocksDB 与布隆过滤器的高性能去重服务 Python 客户端"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Dedup Team" },
]
keywords = ["rocksdb", "bloom-filter", "dedup", "grpc", "爬虫去重"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.21.6",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/datatestautotest/rocksdb_demp"
Repository = "https://github.com/datatestautotest/rocksdb_demp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dedup_client = ["py.typed"]
