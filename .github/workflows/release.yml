name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64 (GLIBC 2.27+ & Static libstdc++ Max Compatibility)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Ubuntu 18.04 Container (GLIBC 2.27 + Static C++ Runtime)
        run: |
          docker run --rm -v "${{ github.workspace }}":/workspace -w /workspace \
            ubuntu:18.04 bash -c "
              set -e
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                curl git ca-certificates build-essential clang libclang-dev pkg-config libssl-dev cmake make
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source /root/.cargo/env
              RUSTFLAGS='-C link-arg=-static-libstdc++ -C link-arg=-static-libgcc' cargo build --release --bin rocksdb-dedup
              strip target/release/rocksdb-dedup || true
              chmod -R a+rwx target/
            "

      - name: Verify Binary Compatibility
        run: |
          file target/release/rocksdb-dedup
          ldd target/release/rocksdb-dedup || true
          objdump -p target/release/rocksdb-dedup | grep -E "GLIBC|GLIBCXX" || true

      - name: Package Release Assets (Linux)
        run: |
          mkdir -p package-linux
          cp target/release/rocksdb-dedup package-linux/
          cp dedup.example.toml package-linux/
          cp DELIVERY.md package-linux/
          mkdir -p package-linux/grafana
          cp grafana/rocksdb_dedup_dashboard.json package-linux/grafana/
          tar -czvf rocksdb-dedup-linux-x86_64.tar.gz -C package-linux .
          cp rocksdb-dedup-linux-x86_64.tar.gz rocksdb-dedup-linux-x86_64-musl.tar.gz

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            rocksdb-dedup-linux-x86_64.tar.gz
            rocksdb-dedup-linux-x86_64-musl.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false

  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc --bin rocksdb-dedup

      - name: Package Release Assets (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-win
          Copy-Item target/x86_64-pc-windows-msvc/release/rocksdb-dedup.exe package-win/
          Copy-Item dedup.example.toml package-win/
          Copy-Item DELIVERY.md package-win/
          New-Item -ItemType Directory -Force -Path package-win/grafana
          Copy-Item grafana/rocksdb_dedup_dashboard.json package-win/grafana/
          Compress-Archive -Path package-win/* -DestinationPath rocksdb-dedup-windows-x86_64.zip

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rocksdb-dedup-windows-x86_64.zip
          generate_release_notes: true
          draft: false
          prerelease: false

  build-macos:
    name: Build macOS (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Build Release Binary
        run: cargo build --release --target aarch64-apple-darwin --bin rocksdb-dedup

      - name: Package Release Assets (macOS)
        run: |
          mkdir -p package-mac
          cp target/aarch64-apple-darwin/release/rocksdb-dedup package-mac/
          cp dedup.example.toml package-mac/
          cp DELIVERY.md package-mac/
          mkdir -p package-mac/grafana
          cp grafana/rocksdb_dedup_dashboard.json package-mac/grafana/
          tar -czvf rocksdb-dedup-macos-arm64.tar.gz -C package-mac .

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rocksdb-dedup-macos-arm64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
