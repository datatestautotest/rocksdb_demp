name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: rocksdb-dedup
            archive_name: rocksdb-dedup-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: rocksdb-dedup.exe
            archive_name: rocksdb-dedup-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: rocksdb-dedup
            archive_name: rocksdb-dedup-macos-arm64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev build-essential

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} --bin rocksdb-dedup

      - name: Package Release Assets (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} package/
          cp dedup.example.toml package/
          cp DELIVERY.md package/
          mkdir -p package/grafana
          cp grafana/rocksdb_dedup_dashboard.json package/grafana/
          tar -czvf ${{ matrix.archive_name }} -C package .

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary_name }} package/
          Copy-Item dedup.example.toml package/
          Copy-Item DELIVERY.md package/
          New-Item -ItemType Directory -Force -Path package/grafana
          Copy-Item grafana/rocksdb_dedup_dashboard.json package/grafana/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
