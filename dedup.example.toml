# ==============================================================================
# RocksDB 去重引擎生产环境配置文件 (dedup.toml)
# ==============================================================================

# RocksDB 底层数据存储目录（支持绝对路径或相对路径）
db_path = "./data/dedup"

# 访问认证密钥 Token（可选。留空或注释表示不启用鉴权；配置后客户端必须携带此 Token 才能访问）
# auth_token = "your-secret-token-here"

# ------------------------------------------------------------------------------
# 布隆过滤器配置 (Bloom Filter)
# ------------------------------------------------------------------------------

# 布隆过滤器预期有效容量（条），建议按重建周期内的预期写入量设置（如日增量 1 亿条）
bloom_capacity = 100000000

# 目标误判率（推荐 0.01 即 1%，越小占用内存越多，1% 时每条约 9.6 bit）
bloom_false_positive_rate = 0.01

# 定时重建周期（秒），默认 86400（24 小时），重建时从 RocksDB 仅拉取未过期数据全量构建，自动剔除过期 Key
bloom_rebuild_interval_secs = 86400

# 自动扩容阈值（0.0 ~ 1.0），当已插入条数 / 设计容量 > 该比例时自动触发扩容重建
bloom_expand_threshold = 0.8

# 扩容倍数（默认 1.5 倍）
bloom_expand_factor = 1.5

# ------------------------------------------------------------------------------
# 过期数据清理配置 (Cleaner)
# ------------------------------------------------------------------------------

# 后台过期清理扫描间隔（秒）
cleaner_interval_secs = 60

# 清理任务基础批大小（自适应限速会在积压增加时自动按 1.5x / 3x / 10x 提高该批次大小）
cleaner_batch_size = 10000

# 清理批次间的休眠时间（毫秒，自适应限速在积压超过 10 万时自动降为 0 毫秒全速清理）
cleaner_batch_sleep_ms = 10

# 累计删除过期 Key 达到该阈值后，后台自动触发 RocksDB compact_range 回收 Tombstone 墓碑与物理磁盘碎片（0 为禁用）
cleaner_compact_threshold = 100000

# ------------------------------------------------------------------------------
# RocksDB 存储与性能调优
# ------------------------------------------------------------------------------

# 单条记录允许携带的最大业务元数据大小（字节）
max_metadata_size = 4096

# 全局共享 LRU Block Cache 大小（MB），推荐分配总物理内存的 15% ~ 30%
block_cache_size_mb = 256

# 是否开启 LSM-Tree 分层压缩（L0-L2 启用 LZ4 低延迟压缩，底层启用 ZSTD 极限高压缩比）
enable_compression = true

# RocksDB 数据块大小（KB），推荐 16KB，适合爬虫随机点查
block_size_kb = 16
